---
layout: default
---
<header class="app-header">
  <h1 class="app-title" data-i18n="app_title"></h1>
  <button type="button" class="lang-toggle" id="lang-toggle"></button>
</header>

<main class="app-main">
  <div class="empty-state" id="empty-state">
    <svg class="empty-illustration" viewBox="0 0 120 164" aria-hidden="true" focusable="false">
      <defs>
        <clipPath id="empty-flask-inside">
          <path transform="translate(12 72) scale(4)" d="M14 2v6a2 2 0 0 0 .245.96l5.51 10.08A2 2 0 0 1 18 22H6a2 2 0 0 1-1.755-2.96l5.51-10.08A2 2 0 0 0 10 8V2z"/>
        </clipPath>
      </defs>
      <g class="smoke">
        <path class="smoke-wisp smoke-wisp-1" pathLength="100" d="M60 76C52 64 68 54 60 42S52 22 60 10"/>
        <path class="smoke-wisp smoke-wisp-2" pathLength="100" d="M57 76C48 66 58 56 50 46S44 30 50 18"/>
        <path class="smoke-wisp smoke-wisp-3" pathLength="100" d="M63 76C72 66 62 56 70 46S76 30 70 20"/>
      </g>
      <rect class="flask-liquid" x="0" y="132" width="120" height="28" clip-path="url(#empty-flask-inside)"/>
      <circle class="flask-bubble" cx="53.6" cy="146.4" r="3.2"/>
      <circle class="flask-bubble" cx="66.4" cy="141.6" r="2.2"/>
      <g class="flask-outline" transform="translate(12 72) scale(4)">
        <path d="M14 2v6a2 2 0 0 0 .245.96l5.51 10.08A2 2 0 0 1 18 22H6a2 2 0 0 1-1.755-2.96l5.51-10.08A2 2 0 0 0 10 8V2"/>
        <path d="M6.453 15h11.094"/>
        <path d="M8.5 2h7"/>
      </g>
    </svg>
    <p class="empty-hint" data-i18n="empty_hint"></p>
  </div>
  <section class="results" id="results" aria-live="polite"></section>
</main>

<form class="mix-form bottom-bar" id="mix-form" novalidate>
  <div class="chip-row" id="example-chips"></div>
  <div class="search-row">
    <span class="mood" id="mood" role="status">
      <span class="mood-emoji" aria-hidden="true">🧙</span>
      <span class="mood-label visually-hidden"></span>
    </span>
    <input class="text-input" id="query-input" name="query" type="text" maxlength="200"
           autocomplete="off" enterkeyhint="search" data-i18n-placeholder="query_placeholder"
           data-i18n-aria-label="query_label">
    <button type="submit" class="submit-button" id="submit-button" data-mode="new">
      <svg class="submit-icon submit-icon-new" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
        <path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/>
        <path d="M20 3v4"/><path d="M22 5h-4"/><path d="M4 17v2"/><path d="M5 18H3"/>
      </svg>
      <svg class="submit-icon submit-icon-regenerate" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
        <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/>
        <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/>
      </svg>
    </button>
  </div>
</form>
