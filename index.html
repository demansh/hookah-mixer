---
layout: default
---
<header class="app-header">
  <h1 class="app-title" data-i18n="app_title"></h1>
  <button type="button" class="lang-toggle" id="lang-toggle"></button>
</header>

<main class="app-main">
  <form class="mix-form" id="mix-form" novalidate>
    <div class="field">
      <label class="field-label" for="query-input" data-i18n="query_label"></label>
      <input class="text-input" id="query-input" name="query" type="text" maxlength="120"
             autocomplete="off" enterkeyhint="search" data-i18n-placeholder="query_placeholder">
      <div class="chip-row" id="example-chips"></div>
      <p class="field-error" id="query-error" role="alert" hidden></p>
    </div>

    <details class="exclusions" id="exclusions">
      <summary class="exclusions-summary">
        <span data-i18n="exclusions_label"></span>
        <span class="exclusions-count" id="exclusions-count"></span>
      </summary>
      <div class="exclusions-body">
        <p class="field-hint" data-i18n="exclusions_hint"></p>
        <div class="inline-row">
          <input class="text-input" id="exclusion-input" type="text" list="flavor-options" maxlength="60"
                 autocomplete="off" enterkeyhint="done" data-i18n-placeholder="exclusions_placeholder">
          <button type="button" class="secondary-button" id="exclusion-add" data-i18n="exclusions_add"></button>
        </div>
        <datalist id="flavor-options"></datalist>
        <p class="field-error" id="exclusion-error" role="alert" hidden></p>
        <div class="chip-row" id="exclusion-chips"></div>
      </div>
    </details>

    <button type="submit" class="submit-button" data-i18n="submit"></button>
  </form>

  <section class="results" id="results" aria-live="polite"></section>
  <button type="button" class="secondary-button more-button" id="more-button" data-i18n="more_variants" hidden></button>
</main>

<footer class="app-footer">
  <span data-i18n="build_label"></span> <span id="build-id"></span>
</footer>
