<!doctype html>
<html lang="{{ site.lang }}" data-baseurl="{{ site.baseurl }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'self'">
  <meta name="theme-color" content="#16120f">
  <meta name="description" content="{{ site.description }}">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="{{ site.title }}">
  <title>{{ site.title }}</title>
  <link rel="manifest" href="{{ '/manifest.webmanifest' | relative_url }}">
  <link rel="icon" href="{{ '/assets/icons/icon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="apple-touch-icon" href="{{ '/assets/icons/apple-touch-icon.png' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <script type="module" src="{{ '/assets/js/app.js' | relative_url }}"></script>
</head>
<body>
  {{ content }}
</body>
</html>
